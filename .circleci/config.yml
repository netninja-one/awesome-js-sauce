version: 2.1

parameters:
  force_full:
    type: boolean
    default: false
jobs:
  validate:
    docker:
      - image: cimg/node:22.14.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check whether full verification is needed
          environment:
            CI_DEFAULT_BRANCH: "master"
            CI_BASE_REVISION: << pipeline.git.base_revision >>
            CI_FORCE_FULL: << pipeline.parameters.force_full >>
          command: bash .circleci/should-run.sh
      - run:
          name: Parse the browser modules
          command: |
            node --input-type=module --check < main.js
            node --input-type=module --check < src/awesome.js
      - run:
          name: Verify the entry point and browser behavior
          command: node .circleci/check-behavior.mjs
workflows:
  validate:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["master", << pipeline.git.branch >>]
    jobs:
      - validate
